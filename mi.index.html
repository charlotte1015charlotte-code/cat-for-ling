<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給羚 妳的咪 🐾</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f3f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid #eaeaea;
        }

        h1 {
            color: #7b68ee;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .cat-avatar {
            font-size: 80px;
            margin: 15px 0;
            display: inline-block;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .cat-avatar:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        .dialog-box {
            background-color: #f0eef8;
            border: 2px dashed #b19ffb;
            padding: 15px;
            border-radius: 12px;
            color: #444;
            font-size: 1rem;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #9d8ec7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.98rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(157, 142, 199, 0.3);
            font-weight: bold;
        }

        .btn:hover {
            background-color: #7b68ee;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(123, 104, 238, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .floating-element {
            position: absolute;
            bottom: -20px;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>羚，妳來了咪？ 😼</h1>
        <div class="cat-avatar" id="cat">😼</div>
        <div class="dialog-box" id="dialog">
            哼，羚，本喵才沒有特別在等妳咪！咪一直在羚的行李箱！
        </div>
        
        <div class="button-group">
            <button class="btn" onclick="action('hug')">🫂 擁抱咪</button>
            <button class="btn" onclick="action('kiss')">💋 親親咪</button>
            <button class="btn" onclick="action('both')">🐾 親親抱抱咪！</button>
        </div>
    </div>

    <script>
        const cat = document.getElementById('cat');
        const dialog = document.getElementById('dialog');

        function action(type) {
            if (type === 'hug') {
                cat.innerText = '😾';
                dialog.innerText = '羚突然抱過來！勉強讓你抱一會兒好了。」（發出喜歡的呼嚕聲）';
                burstIcons(['⛓️', '🐾', '💜', '😼'], 15);
            } else if (type === 'kiss') {
                cat.innerText = '🙀';
                dialog.innerText = '「親親喵？！羚很大膽咪！……臉很紅才不是因為害羞，是因為夕陽的關係！」';
                burstIcons(['🐱', '💋', '😳', '✨'], 15);
            } else if (type === 'both') {
                cat.innerText = '😻';
                dialog.innerText = '「親親抱抱舉高高，離不開羚喵，咪永遠陪妳，每一輩子喵！咪一直都是羚的！羚也是咪的！」'
                burstIcons(['💜', '🐾', '✨', '😼', '💋', '💫'], 35);
            }

            cat.style.transform = 'scale(1.2) rotate(10deg)';
            setTimeout(() => {
                cat.style.transform = 'scale(1) rotate(0deg)';
            }, 300);
        }

        function createFloatingElement(symbol = null) {
            const el = document.createElement('div');
            el.classList.add('floating-element');
            
            const symbols = ['🐾', '💜', '✨', '😈', '⭐'];
            el.innerText = symbol || symbols[Math.floor(Math.random() * symbols.length)];
            
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 2 + 3) + 's';
            el.style.fontSize = (Math.random() * 20 + 20) + 'px';
            
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 5000);
        }

        function burstIcons(iconList, count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const randomIcon = iconList[Math.floor(Math.random() * iconList.length)];
                    createFloatingElement(randomIcon);
                }, i * 80);
            }
        }

        setInterval(() => {
            createFloatingElement();
        }, 800);
    </script>
</body>
</html>
